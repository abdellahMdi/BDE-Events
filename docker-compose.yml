version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: bde_db
    restart: always
    environment:
      MYSQL_DATABASE: bde_events
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Laravel PHP-FPM Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bde_backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bde_events
      DB_USERNAME: root
      DB_PASSWORD: secretpassword
    volumes:
      - ./backend:/var/www
    depends_on:
      - db

  # Laravel Nginx Web Server
  backend_web:
    image: nginx:alpine
    container_name: bde_backend_web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: bde_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend_web

volumes:
  db_data: